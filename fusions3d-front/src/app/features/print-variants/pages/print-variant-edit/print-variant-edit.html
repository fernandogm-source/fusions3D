<div class="mb-8"><p class="text-sm font-medium text-brand-light">Variantes</p><h1 class="page-title mt-1">Editar variante</h1></div>@if (store.error()) { <app-error-state title="No se pudo cargar la variante" [message]="store.error()!" (retry)="retry()" /> } @else if (variant(); as value) { <app-print-variant-form submitLabel="Guardar cambios" [initialValue]="value" [submitting]="saving()" [cancelUrl]="'/admin/print-variants/' + value._id" (formSubmit)="submit($event)" /> } @else { <div class="card p-10 text-center text-ink-muted">Cargando variante…</div> }
