<section class="page-enter flex flex-col gap-8">
  <app-page-header
    eyebrow="Administración"
    [title]="store.trashView() ? 'Papelera de variantes' : 'Variantes de impresión'"
    description="Gestiona SKU, material, color y costes de fabricación."
  >
    @if (store.trashView()) {
      <button (click)="showTrash(false)" class="btn btn-secondary">Volver a variantes</button>
    } @else {
      <button (click)="showTrash(true)" class="btn btn-secondary">Papelera</button>
      <button (click)="create()" class="btn btn-primary">+ Nueva variante</button>
    }
  </app-page-header>

  @if (store.loading()) {
    <div class="card p-10 text-center text-ink-muted">Cargando variantes…</div>
  } @else if (store.error()) {
    <app-error-state title="No se pudieron cargar las variantes" [message]="store.error()!" (retry)="retry()" />
  } @else if (!store.items().length) {
    <app-empty-state
      [title]="store.trashView() ? 'La papelera está vacía' : 'Todavía no hay variantes'"
      [message]="store.trashView() ? 'Las variantes eliminadas aparecerán aquí.' : 'Crea una variante y relaciónala con una impresión y un material.'"
    >
      @if (!store.trashView()) {
        <button (click)="create()" class="btn btn-primary">Crear variante</button>
      }
    </app-empty-state>
  } @else {
    <app-print-variant-table [variants]="store.items()" [trashView]="store.trashView()" (remove)="remove($event)" (toggleActive)="toggle($event)" (restore)="restore($event)" />
  }
</section>
