<section class="page-enter flex flex-col gap-8">
  <app-page-header
    eyebrow="Administración"
    [title]="store.trashView() ? 'Papelera de usuarios' : 'Usuarios'"
    description="Gestiona las cuentas de acceso y sus roles."
  >
    @if (store.trashView()) {
      <button (click)="showTrash(false)" class="btn btn-secondary">Volver a usuarios</button>
    } @else {
      <button (click)="showTrash(true)" class="btn btn-secondary">Papelera</button>
      <button (click)="create()" class="btn btn-primary">+ Nuevo usuario</button>
    }
  </app-page-header>

  @if (store.loading()) {
    <div class="card p-10 text-center text-ink-muted">Cargando usuarios…</div>
  } @else if (store.error()) {
    <app-error-state title="No se pudieron cargar los usuarios" [message]="store.error()!" (retry)="retry()" />
  } @else if (!store.items().length) {
    <app-empty-state
      [title]="store.trashView() ? 'La papelera está vacía' : 'Todavía no hay usuarios'"
      [message]="store.trashView() ? 'Los usuarios eliminados aparecerán aquí.' : 'Crea cuentas para gestionar los usuarios de la tienda.'"
    >
      @if (!store.trashView()) {
        <button (click)="create()" class="btn btn-primary">Crear usuario</button>
      }
    </app-empty-state>
  } @else {
    <app-user-table
      [users]="store.items()"
      [roles]="roles.items()"
      [currentUserId]="auth.user()?.id ?? null"
      [trashView]="store.trashView()"
      (remove)="remove($event)"
      (toggleActive)="toggle($event)"
      (restore)="restore($event)"
    />
  }
</section>
