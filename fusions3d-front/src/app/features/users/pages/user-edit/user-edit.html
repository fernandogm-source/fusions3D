<div class="mb-8"><p class="text-sm font-medium text-brand-light">Usuarios</p><h1 class="page-title mt-1">Editar usuario</h1></div>@if (store.error()) { <app-error-state title="No se pudo cargar el usuario" [message]="store.error()!" (retry)="retry()" /> } @else if (user(); as value) { <app-user-form submitLabel="Guardar cambios" [initialValue]="value" [lockRole]="isCurrentUser(value._id)" [submitting]="saving()" (formSubmit)="submit($event)" /> } @else { <div class="card p-10 text-center text-ink-muted">Cargando usuario…</div> }
