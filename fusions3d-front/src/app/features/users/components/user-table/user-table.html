<div class="card overflow-x-auto p-0"><table class="w-full min-w-[760px] border-collapse text-left text-sm"><thead><tr class="table-head"><th class="px-5 py-3.5">Usuario</th><th class="px-5 py-3.5">Correo</th><th class="px-5 py-3.5">Roles</th>@if (!trashView()) { <th class="px-5 py-3.5">Estado</th> }<th class="px-5 py-3.5 text-right">Acciones</th></tr></thead><tbody>@for (user of users(); track user._id) { <tr class="table-row"><td class="px-5 py-4"><a [routerLink]="['/admin/users', user._id]" class="font-semibold text-ink hover:text-brand-light">{{ user.name }}</a></td><td class="px-5 py-4 text-ink-muted">{{ user.email }}</td><td class="px-5 py-4 text-ink-muted">{{ roleNames(user) }}</td>@if (!trashView()) { <td class="px-5 py-4"><span class="badge" [class]="user.isActive ? 'badge-success' : 'badge-muted'">{{ user.isActive ? 'Activo' : 'Inactivo' }}</span></td> }<td class="px-5 py-4"><div class="flex justify-end gap-1">@if (trashView()) { <button (click)="restore.emit(user)" class="btn btn-ghost !px-3 !py-1.5 text-xs text-success">Restaurar</button> } @else { <a [routerLink]="['/admin/users', user._id, 'editar']" class="btn btn-ghost !px-3 !py-1.5 text-xs">Editar</a><button (click)="toggleActive.emit(user)" class="btn btn-ghost !px-3 !py-1.5 text-xs text-warning">{{ user.isActive ? 'Desactivar' : 'Activar' }}</button><button (click)="remove.emit(user)" class="btn btn-ghost !px-3 !py-1.5 text-xs hover:!text-danger">Eliminar</button> }</div></td></tr> }</tbody></table></div>
