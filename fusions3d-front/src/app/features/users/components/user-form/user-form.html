<form [formGroup]="form" (ngSubmit)="submit()" class="card mx-auto flex max-w-4xl flex-col gap-6 p-6 sm:p-8">
  <div class="grid gap-5 sm:grid-cols-2">
    <div class="flex flex-col gap-2"><label for="user-name" class="label">Nombre *</label><input id="user-name" formControlName="name" maxlength="100" class="input" /></div>
    <div class="flex flex-col gap-2"><label for="user-email" class="label">Correo electrónico *</label><input id="user-email" type="email" formControlName="email" class="input" /></div>
    <div class="flex flex-col gap-2"><label for="user-password" class="label">Contraseña {{ initialValue() ? '(opcional)' : '*' }}</label><input id="user-password" type="password" formControlName="password" autocomplete="new-password" minlength="8" class="input" />@if (form.controls.password.invalid && form.controls.password.touched) { <span class="field-error">La contraseña debe tener al menos 8 caracteres.</span> }</div>
    <div class="flex flex-col gap-2"><label for="user-phone" class="label">Teléfono</label><input id="user-phone" formControlName="phone" maxlength="30" class="input" /></div>
    <div class="flex flex-col gap-2 sm:col-span-2"><label for="user-roles" class="label">Roles</label><select id="user-roles" formControlName="roles" multiple class="input min-h-32">@for (role of roles(); track role._id) { <option [value]="role._id">{{ role.name }}</option> }</select><span class="text-xs text-ink-faint">Puedes seleccionar varios roles (Ctrl/Cmd + clic).</span></div>
  </div>
  <fieldset class="grid gap-5 border-t border-line pt-6 sm:grid-cols-2">
    <legend class="mb-3 font-display text-lg font-semibold text-ink">Dirección (opcional)</legend>
    <div class="flex flex-col gap-2"><label for="user-street" class="label">Calle</label><input id="user-street" formControlName="street" class="input" /></div>
    <div class="flex flex-col gap-2"><label for="user-city" class="label">Ciudad</label><input id="user-city" formControlName="city" class="input" /></div>
    <div class="flex flex-col gap-2"><label for="user-state" class="label">Provincia / estado</label><input id="user-state" formControlName="state" class="input" /></div>
    <div class="flex flex-col gap-2"><label for="user-postal" class="label">Código postal</label><input id="user-postal" formControlName="postalCode" class="input" /></div>
    <div class="flex flex-col gap-2"><label for="user-country" class="label">País</label><input id="user-country" formControlName="country" class="input" /></div>
    <label class="flex cursor-pointer items-center gap-3 rounded-lg border border-line bg-base px-3.5 py-3 text-sm text-ink"><input type="checkbox" formControlName="isDefault" class="h-4 w-4 accent-brand" />Dirección predeterminada</label>
  </fieldset>
  @if (formError()) { <p role="alert" class="rounded-lg border border-danger/25 bg-danger/10 px-4 py-3 text-sm text-danger">{{ formError() }}</p> }
  <div class="flex flex-col-reverse gap-3 border-t border-line pt-6 sm:flex-row sm:justify-end"><a [routerLink]="cancelUrl()" class="btn btn-secondary">Cancelar</a><button type="submit" [disabled]="submitting()" class="btn btn-primary min-w-40">{{ submitting() ? 'Guardando…' : submitLabel() }}</button></div>
</form>
