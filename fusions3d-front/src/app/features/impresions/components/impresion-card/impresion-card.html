<article
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60 transition hover:-translate-y-1 hover:border-[#ff6000]/60 hover:shadow-xl hover:shadow-[#ff6000]/5"
>
  <a [routerLink]="['/impresiones', impresion().slug]" class="block" tabindex="-1" aria-hidden="true">
    <div class="relative aspect-[16/10] overflow-hidden bg-slate-800">
      <img
        [src]="imageUrl()"
        [alt]="'Imagen de ' + impresion().nombre"
        loading="lazy"
        class="h-full w-full object-cover transition duration-300 group-hover:scale-105"
        [class.grayscale]="!impresion().isActive"
      />
      @if (!impresion().isActive) {
        <span class="absolute left-3 top-3 rounded-full bg-slate-950/80 px-3 py-1 text-xs font-semibold text-slate-300 ring-1 ring-slate-600">
          Inactiva
        </span>
      }
    </div>
  </a>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <div class="flex items-start justify-between gap-3">
      <h3 class="text-lg font-semibold leading-snug text-slate-100">
        <a [routerLink]="['/impresiones', impresion().slug]" class="transition group-hover:text-[#ff8a4c]">
          {{ impresion().nombre }}
        </a>
      </h3>
      <span
        class="shrink-0 rounded-full px-2.5 py-1 text-xs font-medium ring-1"
        [class]="statusClass()"
      >
        {{ statusLabel() }}
      </span>
    </div>

    <p class="line-clamp-2 text-sm text-slate-400">{{ impresion().descripcion }}</p>

    <div class="mt-auto flex items-end justify-between pt-2">
      <p class="text-2xl font-extrabold text-[#ff6000]">
        {{ impresion().precio_venta | currency: 'EUR' : 'symbol' : '1.2-2' : 'es' }}
      </p>
      <p class="text-xs text-slate-500">⏱ {{ tiempoImpresion() }}</p>
    </div>
  </div>
</article>
