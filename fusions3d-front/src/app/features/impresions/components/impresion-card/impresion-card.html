<article
  class="card group flex h-full flex-col overflow-hidden transition duration-300 hover:-translate-y-1 hover:border-brand/40 hover:shadow-[0_24px_48px_-24px_rgb(255_96_0/0.35)]"
>
  <a [routerLink]="['/impresiones', impresion().slug]" class="block" tabindex="-1" aria-hidden="true">
    <div class="relative aspect-[16/10] overflow-hidden bg-elevated">
      <img
        [src]="imageUrl()"
        [alt]="'Imagen de ' + impresion().name"
        loading="lazy"
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        [class.grayscale]="!impresion().isActive && hasPhoto()"
      />
      @if (!impresion().isActive) {
        <span class="badge badge-muted absolute left-3 top-3 bg-base/80 backdrop-blur">Inactiva</span>
      }
    </div>
  </a>

  <div class="flex flex-1 flex-col gap-3 p-5">
    <div class="flex items-start justify-between gap-3">
      <h3 class="font-display text-lg font-semibold leading-snug text-ink">
        <a [routerLink]="['/impresiones', impresion().slug]" class="transition-colors group-hover:text-brand-light">
          {{ impresion().name }}
        </a>
      </h3>
      <span class="badge shrink-0" [class]="statusClass()">{{ statusLabel() }}</span>
    </div>

    <p class="line-clamp-2 text-sm leading-relaxed text-ink-muted">{{ impresion().description }}</p>
  </div>
</article>
