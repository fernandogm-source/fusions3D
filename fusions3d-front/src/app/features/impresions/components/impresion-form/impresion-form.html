<form
  [formGroup]="form"
  (ngSubmit)="onSubmit()"
  novalidate
  class="card mx-auto flex max-w-3xl flex-col gap-6 p-6 sm:p-8"
>
  <!-- Nombre -->
  <div class="flex flex-col gap-2">
    <label for="name" class="label">
      Nombre <span class="text-brand" aria-hidden="true">*</span>
    </label>
    <input
      id="name"
      type="text"
      formControlName="name"
      maxlength="150"
      placeholder="Soporte para móvil"
      [attr.aria-invalid]="hasError('name')"
      aria-describedby="name-error"
      class="input"
      [class.input-error]="hasError('name')"
    />
    @if (errorMessage('name', 'El nombre'); as message) {
      <p id="name-error" role="alert" class="field-error">{{ message }}</p>
    }
  </div>

  <!-- Descripción -->
  <div class="flex flex-col gap-2">
    <label for="description" class="label">
      Descripción <span class="text-brand" aria-hidden="true">*</span>
    </label>
    <textarea
      id="description"
      formControlName="description"
      rows="4"
      maxlength="2000"
      placeholder="Describe la pieza, materiales recomendados, acabados…"
      [attr.aria-invalid]="hasError('description')"
      aria-describedby="description-error description-count"
      class="input resize-y"
      [class.input-error]="hasError('description')"
    ></textarea>
    <div class="flex items-center justify-between gap-4">
      @if (errorMessage('description', 'La descripción'); as message) {
        <p id="description-error" role="alert" class="field-error">{{ message }}</p>
      } @else {
        <span></span>
      }
      <span id="description-count" class="text-xs tabular-nums text-ink-faint">
        {{ form.get('description')?.value?.length ?? 0 }}/2000
      </span>
    </div>
  </div>

  <!-- Categoría y estado -->
  <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
    <div class="flex flex-col gap-2">
      <label for="categoryId" class="label">
        Categoría <span class="text-brand" aria-hidden="true">*</span>
      </label>
      <select
        id="categoryId"
        formControlName="categoryId"
        class="input"
        [class.input-error]="hasError('categoryId')"
      >
        <option value="" disabled>Selecciona una categoría</option>
        @for (category of categories(); track category._id) {
          <option [value]="category._id">{{ category.name }}</option>
        }
      </select>
      @if (hasError('categoryId')) {
        <p role="alert" class="field-error">Selecciona una categoría.</p>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label for="status" class="label">
        Estado <span class="text-brand" aria-hidden="true">*</span>
      </label>
      <select id="status" formControlName="status" class="input">
        @for (option of statusOptions(); track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </div>
  </div>

  <!-- Acciones -->
  <div class="flex flex-col-reverse gap-3 border-t border-line pt-6 sm:flex-row sm:justify-end">
    <a [routerLink]="cancelUrl()" class="btn btn-secondary">Cancelar</a>
    <button type="submit" [disabled]="submitting()" class="btn btn-primary min-w-40">
      {{ submitting() ? 'Guardando…' : submitLabel() }}
    </button>
  </div>
</form>
