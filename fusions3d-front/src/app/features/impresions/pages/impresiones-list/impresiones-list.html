<section class="page-enter flex flex-col gap-8">
  <app-page-header
    [eyebrow]="trashView() ? 'Papelera' : 'Catálogo'"
    [title]="trashView() ? 'Impresiones eliminadas' : 'Impresiones 3D'"
    [description]="store.loading()
      ? 'Cargando catálogo…'
      : store.total() + ' producto' + (store.total() === 1 ? '' : 's') + (trashView() ? ' en la papelera' : ' en el catálogo')"
  >
    @if (trashView()) {
      <button type="button" (click)="setTrashView(false)" class="btn btn-secondary">Volver al catálogo</button>
    } @else {
      <button type="button" (click)="setTrashView(true)" class="btn btn-secondary">Papelera</button>
      <a routerLink="/impresiones/nueva" class="btn btn-primary">
        <span aria-hidden="true" class="text-base leading-none">+</span> Nueva impresión
      </a>
    }
  </app-page-header>

  <!-- Skeletons mientras carga por primera vez -->
  @if (store.loading() && !store.loaded()) {
    <app-table-skeleton [rows]="6" />
  }

  <!-- Error de la API -->
  @if (store.hasError() && !store.loading()) {
    <app-error-state
      title="No se ha podido cargar el catálogo"
      [message]="store.error() ?? 'Error desconocido'"
      (retry)="retry()"
    />
  }

  <!-- Sin resultados -->
  @if (store.isEmpty() && !store.hasError()) {
    <app-empty-state
      [title]="trashView() ? 'La papelera está vacía' : 'Todavía no hay impresiones'"
      [message]="trashView() ? 'Las impresiones eliminadas aparecerán aquí.' : 'Crea tu primera impresión 3D para empezar a vender.'"
    >
      @if (!trashView()) {
        <a routerLink="/impresiones/nueva" class="btn btn-primary mt-2">Crear impresión</a>
      }
    </app-empty-state>
  }

  <!-- Listado -->
  @if (!store.loading() && !store.hasError() && !store.isEmpty()) {
    <app-impresion-table
      [impresions]="store.impresions()"
      [deletedMode]="trashView()"
      (delete)="delete($event)"
      (toggleActive)="toggleActive($event)"
      (restore)="restore($event)"
    />
  }
</section>
