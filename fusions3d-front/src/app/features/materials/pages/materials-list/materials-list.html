<section class="page-enter flex flex-col gap-8">
  <app-page-header
    eyebrow="Administración"
    [title]="store.trashView() ? 'Papelera de materiales' : 'Materiales'"
    [description]="store.items().length + (store.items().length === 1 ? ' material' : ' materiales') + (store.trashView() ? ' en la papelera' : ' disponible' + (store.items().length === 1 ? '' : 's'))"
  >
    @if (store.trashView()) {
      <button (click)="showTrash(false)" class="btn btn-secondary">Volver a materiales</button>
    } @else {
      <button (click)="showTrash(true)" class="btn btn-secondary">Papelera</button>
      <button (click)="create()" class="btn btn-primary">+ Nuevo material</button>
    }
  </app-page-header>

  @if (store.loading()) {
    <div class="card p-10 text-center text-ink-muted">Cargando materiales…</div>
  } @else if (store.error()) {
    <app-error-state title="No se pudieron cargar los materiales" [message]="store.error()!" (retry)="retry()" />
  } @else if (!store.items().length) {
    <app-empty-state
      [title]="store.trashView() ? 'La papelera está vacía' : 'Todavía no hay materiales'"
      [message]="store.trashView() ? 'Los materiales eliminados aparecerán aquí.' : 'Crea materiales para asociarlos a las variantes.'"
    >
      @if (!store.trashView()) {
        <button (click)="create()" class="btn btn-primary">Crear material</button>
      }
    </app-empty-state>
  } @else {
    <app-material-table [materials]="store.items()" [trashView]="store.trashView()" (remove)="remove($event)" (toggleActive)="toggle($event)" (restore)="restore($event)" />
  }
</section>
