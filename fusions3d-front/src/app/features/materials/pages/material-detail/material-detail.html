<a routerLink="/admin/materials" class="mb-6 inline-flex text-sm text-ink-muted hover:text-brand-light">← Volver a materiales</a>@if (store.error()) { <app-error-state title="No se pudo cargar el material" [message]="store.error()!" (retry)="retry()" /> } @else if (material(); as material) { <section class="flex flex-col gap-6"><div class="flex items-start justify-between"><div><p class="text-sm font-medium text-brand-light">Material</p><h1 class="page-title mt-1">{{ material.name }}</h1></div><a [routerLink]="['/admin/materials', material._id, 'editar']" class="btn btn-primary">Editar material</a></div><dl class="card grid gap-5 p-6 sm:grid-cols-2"><div><dt class="label">Estado</dt><dd class="mt-2"><span class="badge" [class]="material.isActive ? 'badge-success' : 'badge-muted'">{{ material.isActive ? 'Activo' : 'Inactivo' }}</span></dd></div><div><dt class="label">Identificador</dt><dd class="mt-2 font-mono text-xs text-ink-muted">{{ material._id }}</dd></div></dl></section> } @else { <div class="card p-10 text-center text-ink-muted">Cargando material…</div> }
