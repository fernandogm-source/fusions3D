<div class="mb-8"><p class="text-sm font-medium text-brand-light">Materiales</p><h1 class="page-title mt-1">Editar material</h1></div>@if (store.error()) { <app-error-state title="No se pudo cargar el material" [message]="store.error()!" (retry)="retry()" /> } @else if (material(); as value) { <app-material-form submitLabel="Guardar cambios" [initialValue]="value" [submitting]="saving()" (formSubmit)="submit($event)" /> } @else { <div class="card p-10 text-center text-ink-muted">Cargando material…</div> }
