<div class="card overflow-x-auto p-0"><table class="w-full min-w-[560px] border-collapse text-left text-sm">
  <thead><tr class="table-head"><th class="px-5 py-3.5">Material</th>@if (!trashView()) { <th class="px-5 py-3.5">Estado</th> }<th class="px-5 py-3.5 text-right">Acciones</th></tr></thead>
  <tbody>@for (material of materials(); track material._id) { <tr class="table-row" [class.table-row-inactive]="!trashView() && !material.isActive"><td class="px-5 py-4"><span class="font-semibold text-ink">{{ material.name }}</span></td>@if (!trashView()) { <td class="px-5 py-4"><span class="badge" [class]="material.isActive ? 'badge-success' : 'badge-muted'">{{ material.isActive ? 'Activo' : 'Inactivo' }}</span></td> }<td class="px-5 py-4"><div class="flex justify-end gap-2">@if (trashView()) { <button (click)="restore.emit(material)" class="btn btn-ghost !px-3 !py-1.5 text-xs text-success">Restaurar</button> } @else { <a [routerLink]="['/admin/materials', material._id, 'editar']" class="btn btn-action btn-action-edit">Editar</a><button (click)="toggleActive.emit(material)" class="btn btn-action" [class.btn-action-deactivate]="material.isActive" [class.btn-action-activate]="!material.isActive">{{ material.isActive ? 'Desactivar' : 'Activar' }}</button><button (click)="remove.emit(material)" class="btn btn-action btn-action-delete">Eliminar</button> }</div></td></tr> }</tbody>
</table></div>
