<div class="mb-8"><p class="text-sm font-medium text-brand-light">Categorías</p><h1 class="page-title mt-1">Editar categoría</h1></div>
@if (store.error()) { <app-error-state title="No se pudo cargar la categoría" [message]="store.error()!" (retry)="retry()" /> }
@else if (category(); as value) { <app-category-form submitLabel="Guardar cambios" [initialValue]="value" [submitting]="saving()" (formSubmit)="submit($event)" /> }
@else { <div class="card p-10 text-center text-ink-muted">Cargando categoría…</div> }
