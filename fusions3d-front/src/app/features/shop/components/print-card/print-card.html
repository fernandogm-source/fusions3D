<a
  [routerLink]="['/shop', print().slug]"
  class="card card-interactive group flex h-full flex-col overflow-hidden"
  [attr.aria-label]="print().name + ', ' + price()"
>
  <div class="relative aspect-[4/3] overflow-hidden bg-elevated">
    <img
      [src]="image()"
      [alt]="print().cover?.altText || print().name"
      loading="lazy"
      (error)="imageFailed.set(true)"
      class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
    />
  </div>

  <div class="flex flex-1 flex-col gap-3 p-4">
    @if (print().categoryName) {
      <span class="text-xs font-medium uppercase tracking-wider text-brand-light">{{ print().categoryName }}</span>
    }

    <h3 class="font-display text-lg font-semibold leading-snug text-ink">{{ print().name }}</h3>

    @if (visibleMaterials().length) {
      <ul class="flex flex-wrap gap-1.5" aria-label="Materiales disponibles">
        @for (material of visibleMaterials(); track material.slug) {
          <li class="badge badge-muted">{{ material.name }}</li>
        }
        @if (hiddenMaterials() > 0) {
          <li class="badge badge-muted">+{{ hiddenMaterials() }}</li>
        }
      </ul>
    }

    <p class="mt-auto pt-2 font-display text-base font-semibold text-ink">{{ price() }}</p>
  </div>
</a>
