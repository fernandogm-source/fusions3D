<div class="mb-8"><p class="text-sm font-medium text-brand-light">Roles</p><h1 class="page-title mt-1">Editar rol</h1></div>@if (store.error()) { <app-error-state title="No se pudo cargar el rol" [message]="store.error()!" (retry)="retry()" /> } @else if (role(); as value) { <app-role-form submitLabel="Guardar cambios" [initialValue]="value" [submitting]="saving()" [cancelUrl]="'/admin/roles/' + value._id" (formSubmit)="submit($event)" /> } @else { <div class="card p-10 text-center text-ink-muted">Cargando rol…</div> }
