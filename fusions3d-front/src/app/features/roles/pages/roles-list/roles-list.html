<section class="page-enter flex flex-col gap-8">
  <app-page-header
    eyebrow="Administración"
    [title]="store.trashView() ? 'Papelera de roles' : 'Roles'"
    description="Gestiona los roles asignables a los usuarios."
  >
    @if (store.trashView()) {
      <button (click)="showTrash(false)" class="btn btn-secondary">Volver a roles</button>
    } @else {
      <button (click)="showTrash(true)" class="btn btn-secondary">Papelera</button>
      <button (click)="create()" class="btn btn-primary">+ Nuevo rol</button>
    }
  </app-page-header>

  @if (store.loading()) {
    <div class="card p-10 text-center text-ink-muted">Cargando roles…</div>
  } @else if (store.error()) {
    <app-error-state title="No se pudieron cargar los roles" [message]="store.error()!" (retry)="retry()" />
  } @else if (!store.items().length) {
    <app-empty-state
      [title]="store.trashView() ? 'La papelera está vacía' : 'Todavía no hay roles'"
      [message]="store.trashView() ? 'Los roles eliminados aparecerán aquí.' : 'Crea roles para asignarlos a usuarios.'"
    >
      @if (!store.trashView()) {
        <button (click)="create()" class="btn btn-primary">Crear rol</button>
      }
    </app-empty-state>
  } @else {
    <app-role-table [roles]="store.items()" [trashView]="store.trashView()" (remove)="remove($event)" (toggleActive)="toggle($event)" (restore)="restore($event)" />
  }
</section>
