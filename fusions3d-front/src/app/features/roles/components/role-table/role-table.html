<div class="card overflow-x-auto p-0"><table class="w-full min-w-[560px] border-collapse text-left text-sm"><thead><tr class="table-head"><th class="px-5 py-3.5">Rol</th>@if (!trashView()) { <th class="px-5 py-3.5">Estado</th> }<th class="px-5 py-3.5 text-right">Acciones</th></tr></thead><tbody>@for (role of roles(); track role._id) { <tr class="table-row" [class.table-row-inactive]="!trashView() && !role.isActive"><td class="px-5 py-4"><span class="font-semibold text-ink">{{ role.name }}</span></td>@if (!trashView()) { <td class="px-5 py-4"><span class="badge" [class]="role.isActive ? 'badge-success' : 'badge-muted'">{{ role.isActive ? 'Activo' : 'Inactivo' }}</span></td> }<td class="px-5 py-4"><div class="flex justify-end gap-2">@if (trashView()) { <button (click)="restore.emit(role)" class="btn btn-ghost !px-3 !py-1.5 text-xs text-success">Restaurar</button> } @else { <a [routerLink]="['/admin/roles', role._id, 'editar']" class="btn btn-action btn-action-edit">Editar</a><button (click)="toggleActive.emit(role)" class="btn btn-action" [class.btn-action-deactivate]="role.isActive" [class.btn-action-activate]="!role.isActive">{{ role.isActive ? 'Desactivar' : 'Activar' }}</button><button (click)="remove.emit(role)" class="btn btn-action btn-action-delete">Eliminar</button> }</div></td></tr> }</tbody></table></div>
