<form [formGroup]="form" (ngSubmit)="submit()" class="card mx-auto flex max-w-2xl flex-col gap-6 p-6 sm:p-8"><div class="flex flex-col gap-2"><label for="role-name" class="label">Nombre <span class="text-brand">*</span></label><input id="role-name" formControlName="name" maxlength="50" placeholder="Gestor" class="input" />@if (form.controls.name.invalid && form.controls.name.touched) { <span class="field-error">Introduce un nombre de hasta 50 caracteres.</span> }</div><div class="flex flex-col-reverse gap-3 border-t border-line pt-6 sm:flex-row sm:justify-end"><a [routerLink]="cancelUrl()" class="btn btn-secondary">Cancelar</a><button type="submit" [disabled]="submitting()" class="btn btn-primary min-w-40">{{ submitting() ? 'Guardando…' : submitLabel() }}</button></div></form>
