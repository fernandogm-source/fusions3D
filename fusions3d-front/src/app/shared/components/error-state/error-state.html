<div
  class="flex flex-col items-center justify-center gap-4 rounded-2xl border border-red-900/50 bg-red-950/20 px-6 py-16 text-center"
  role="alert"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    class="h-16 w-16 text-red-500/80"
    fill="none"
    viewBox="0 0 24 24"
    stroke="currentColor"
    stroke-width="1.5"
    aria-hidden="true"
  >
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
    />
  </svg>
  <h2 class="text-xl font-semibold text-red-300">{{ title() }}</h2>
  <p class="max-w-md text-sm text-red-200/70">{{ message() }}</p>
  <button
    type="button"
    (click)="retry.emit()"
    class="mt-2 rounded-lg bg-[#ff6000] px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-[#cc4d00] focus:outline-none focus:ring-2 focus:ring-[#ff6000]/50"
  >
    Reintentar
  </button>
</div>
