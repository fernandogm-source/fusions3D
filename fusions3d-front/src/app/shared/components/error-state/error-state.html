<div
  class="flex flex-col items-center justify-center gap-4 rounded-2xl border border-danger/25 bg-danger/5 px-6 py-16 text-center"
  role="alert"
>
  <span class="grid h-16 w-16 place-items-center rounded-2xl bg-danger/10 text-danger ring-1 ring-danger/25">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-8 w-8"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"
      />
    </svg>
  </span>
  <h2 class="font-display text-xl font-semibold text-ink">{{ title() }}</h2>
  <p class="max-w-md text-sm text-ink-muted">{{ message() }}</p>
  <button type="button" (click)="retry.emit()" class="btn btn-primary mt-2">
    Reintentar
  </button>
</div>
