<div
  class="overflow-hidden rounded-2xl border border-line bg-surface shadow-card"
  aria-busy="true"
  aria-label="Cargando impresiones"
>
  @for (item of items; track item) {
    <div class="flex items-center gap-4 border-b border-line/70 px-4 py-3.5 last:border-0">
      <ngx-skeleton-loader
        count="1"
        appearance="line"
        [theme]="{ height: '40px', width: '40px', 'background-color': '#161e2e', 'border-radius': '0.5rem', margin: '0' }"
      />
      <div class="flex flex-1 flex-col gap-2">
        <ngx-skeleton-loader
          count="1"
          appearance="line"
          [theme]="{ height: '14px', width: '40%', 'background-color': '#161e2e', 'border-radius': '0.5rem', margin: '0' }"
        />
        <ngx-skeleton-loader
          count="1"
          appearance="line"
          [theme]="{ height: '10px', width: '25%', 'background-color': '#161e2e', 'border-radius': '0.5rem', margin: '0' }"
        />
      </div>
      <ngx-skeleton-loader
        count="1"
        appearance="line"
        [theme]="{ height: '14px', width: '60px', 'background-color': '#161e2e', 'border-radius': '0.5rem', margin: '0' }"
      />
      <ngx-skeleton-loader
        count="1"
        appearance="line"
        [theme]="{ height: '22px', width: '70px', 'background-color': '#161e2e', 'border-radius': '9999px', margin: '0' }"
      />
    </div>
  }
</div>
