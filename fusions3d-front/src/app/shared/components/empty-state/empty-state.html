<div
  class="page-enter flex flex-col items-center justify-center gap-5 rounded-2xl border border-dashed border-line-strong bg-gradient-to-b from-surface to-base/60 px-6 py-16 text-center"
>
  <span class="relative grid h-16 w-16 place-items-center rounded-2xl bg-elevated text-brand-light ring-1 ring-line">
    <span class="absolute inset-0 -z-10 rounded-2xl bg-brand/25 blur-xl" aria-hidden="true"></span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      class="h-8 w-8"
      fill="none"
      viewBox="0 0 24 24"
      stroke="currentColor"
      stroke-width="1.5"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"
      />
    </svg>
  </span>
  <div class="flex flex-col gap-2">
    <h2 class="font-display text-xl font-semibold text-ink">{{ title() }}</h2>
    <p class="mx-auto max-w-md text-sm text-ink-muted">{{ message() }}</p>
  </div>
  <ng-content />
</div>
