<section class="flex flex-col gap-4" [attr.aria-label]="title()">
  <header class="flex items-end justify-between gap-4">
    <div class="flex flex-col gap-1">
      <h2 class="font-display text-2xl font-semibold tracking-tight text-ink">{{ title() }}</h2>
      @if (subtitle()) {
        <p class="text-sm text-ink-muted">{{ subtitle() }}</p>
      }
    </div>
    <div class="flex gap-2">
      <button
        type="button"
        class="btn btn-secondary !p-2"
        aria-label="Desplazar a la izquierda"
        [disabled]="!canScrollPrev()"
        (click)="scroll(-1)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-secondary !p-2"
        aria-label="Desplazar a la derecha"
        [disabled]="!canScrollNext()"
        (click)="scroll(1)"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
        </svg>
      </button>
    </div>
  </header>

  <div
    #track
    tabindex="0"
    class="flex snap-x snap-mandatory gap-4 overflow-x-auto pb-3 scroll-smooth"
    (scroll)="updateState()"
  >
    <ng-content />
  </div>
</section>
