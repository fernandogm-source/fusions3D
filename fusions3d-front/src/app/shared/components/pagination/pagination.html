@if (totalPages() > 1) {
  <nav class="flex items-center justify-center gap-2" aria-label="Paginación">
    <button type="button" class="btn btn-secondary" [disabled]="page() <= 1" (click)="go(page() - 1)">
      Anterior
    </button>

    @for (item of items(); track $index) {
      @if (item === null) {
        <span class="px-2 text-ink-faint" aria-hidden="true">…</span>
      } @else {
        <button
          type="button"
          class="btn min-w-10 !px-3"
          [class.btn-primary]="item === page()"
          [class.btn-secondary]="item !== page()"
          [attr.aria-current]="item === page() ? 'page' : null"
          [attr.aria-label]="'Página ' + item"
          (click)="go(item)"
        >
          {{ item }}
        </button>
      }
    }

    <button type="button" class="btn btn-secondary" [disabled]="page() >= totalPages()" (click)="go(page() + 1)">
      Siguiente
    </button>
  </nav>
}
