@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-base/70 backdrop-blur-sm"
    role="status"
    aria-live="polite"
    aria-label="Cargando"
  >
    <div class="flex flex-col items-center gap-4 rounded-2xl border border-line bg-surface px-8 py-6 shadow-pop">
      <div
        class="h-11 w-11 animate-spin rounded-full border-[3px] border-line-strong border-t-brand"
      ></div>
      <span class="text-sm font-medium text-ink-muted">Cargando…</span>
    </div>
  </div>
}
