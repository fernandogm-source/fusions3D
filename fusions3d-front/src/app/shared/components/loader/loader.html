@if (loadingService.isLoading()) {
  <div
    class="fixed inset-0 z-[9999] flex items-center justify-center bg-slate-950/60 backdrop-blur-sm"
    role="status"
    aria-live="polite"
    aria-label="Cargando"
  >
    <div class="flex flex-col items-center gap-3">
      <div
        class="h-14 w-14 animate-spin rounded-full border-4 border-slate-700 border-t-[#ff6000]"
      ></div>
      <span class="text-sm font-medium text-slate-300">Cargando…</span>
    </div>
  </div>
}
