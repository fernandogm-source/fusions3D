<div class="flex flex-col gap-3" role="group" aria-label="Rango de precio">
  <div class="flex items-center justify-between text-sm">
    <span class="font-medium text-ink-muted">{{ format(low()) }}</span>
    <span class="text-ink-faint">–</span>
    <span class="font-medium text-ink-muted">{{ format(high()) }}</span>
  </div>

  <div class="relative h-6">
    <input
      type="range"
      class="pointer-events-none absolute inset-0 h-6 w-full appearance-none bg-transparent accent-brand [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-brand"
      [min]="bounds().min"
      [max]="bounds().max"
      step="1"
      [value]="low()"
      [disabled]="bounds().min === bounds().max"
      aria-label="Precio mínimo"
      (input)="onLow($any($event.target).value)"
    />
    <input
      type="range"
      class="pointer-events-none absolute inset-0 h-6 w-full appearance-none bg-transparent accent-brand [&::-webkit-slider-thumb]:pointer-events-auto [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:h-4 [&::-webkit-slider-thumb]:w-4 [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-brand"
      [min]="bounds().min"
      [max]="bounds().max"
      step="1"
      [value]="high()"
      [disabled]="bounds().min === bounds().max"
      aria-label="Precio máximo"
      (input)="onHigh($any($event.target).value)"
    />
  </div>
</div>
