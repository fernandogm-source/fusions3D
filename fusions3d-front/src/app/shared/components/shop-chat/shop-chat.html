<div class="fixed bottom-4 right-4 z-40 flex flex-col items-end gap-3 sm:bottom-6 sm:right-6">
  @if (open()) {
    <section
      id="shop-chat-panel"
      aria-label="Chat con Fusionito"
      class="card flex h-[28rem] w-[calc(100vw-2rem)] max-w-sm flex-col overflow-hidden p-0"
    >
      <header class="flex items-center justify-between border-b border-line/70 px-4 py-3">
        <h2 class="font-display text-base font-bold text-ink">Fusionito</h2>
        <button type="button" class="btn btn-ghost !p-2" aria-label="Cerrar chat" (click)="toggle()">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </header>

      <div class="flex flex-1 flex-col gap-3 overflow-y-auto px-4 py-3" aria-live="polite">
        @for (message of messages(); track $index) {
          <div
            [class]="message.role === 'user' ? 'self-end bg-brand text-white' : 'self-start bg-surface text-ink'"
            class="max-w-[85%] whitespace-pre-line rounded-2xl px-3 py-2 text-sm"
          >
            {{ message.content }}
          </div>
        }

        @if (sending()) {
          <p class="self-start text-sm text-ink-muted">Fusionito está escribiendo…</p>
        }
      </div>

      @if (error(); as message) {
        <p role="alert" class="field-error px-4 pb-2">{{ message }}</p>
      }

      <form class="flex items-center gap-2 border-t border-line/70 p-3" (ngSubmit)="send()">
        <input
          type="text"
          name="draft"
          maxlength="1000"
          [ngModel]="draft()"
          (ngModelChange)="draft.set($event)"
          placeholder="Escribe tu pregunta…"
          aria-label="Mensaje para Fusionito"
          class="input"
        />
        <button type="submit" class="btn btn-primary shrink-0" [disabled]="sending() || !draft().trim()">
          Enviar
        </button>
      </form>
    </section>
  }

  <button
    type="button"
    class="btn btn-primary !rounded-full !p-4 shadow-lg"
    [attr.aria-expanded]="open()"
    aria-controls="shop-chat-panel"
    aria-label="Abrir chat con Fusionito"
    (click)="toggle()"
  >
    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h8M8 14h5m-9 6l3-3h8a3 3 0 003-3V7a3 3 0 00-3-3H6a3 3 0 00-3 3v7a3 3 0 003 3z" />
    </svg>
  </button>
</div>
