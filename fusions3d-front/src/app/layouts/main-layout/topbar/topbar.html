<header class="sticky top-0 z-30 border-b border-line/80 bg-base/80 backdrop-blur-xl">
  <div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <button
        type="button"
        (click)="menuToggle.emit()"
        class="btn btn-ghost !p-2 lg:hidden"
        aria-label="Abrir menú de navegación"
        aria-controls="sidebar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h2 class="truncate font-display text-lg font-semibold tracking-tight text-ink sm:text-xl">{{ title() }}</h2>
    </div>

    <div class="flex items-center gap-3">
      @if (auth.isAdmin()) {
        <span class="badge badge-brand hidden sm:inline-flex">
          <span class="h-1.5 w-1.5 rounded-full bg-brand"></span>
          Administración
        </span>
      }
      <span class="hidden text-sm font-medium text-ink sm:inline">{{ auth.user()?.username }}</span>
      <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand to-brand-dark text-sm font-bold text-white shadow-[0_8px_18px_-10px_rgb(255_96_0/0.9)]" aria-hidden="true">{{ initial() }}</span>
      <button
        type="button"
        (click)="logout()"
        class="btn btn-ghost !p-2"
        aria-label="Cerrar sesión"
        title="Cerrar sesión"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
      </button>
    </div>
  </div>
</header>
