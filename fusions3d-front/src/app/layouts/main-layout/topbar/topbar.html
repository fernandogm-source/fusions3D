<header class="sticky top-0 z-30 border-b border-line/80 bg-base/80 backdrop-blur-xl">
  <div class="flex h-16 items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-3">
      <button
        type="button"
        (click)="menuToggle.emit()"
        class="btn btn-ghost !p-2 lg:hidden"
        aria-label="Abrir menú de navegación"
        aria-controls="sidebar"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
      <h2 class="truncate font-display text-lg font-semibold tracking-tight text-ink sm:text-xl">{{ title() }}</h2>
    </div>

    <div class="flex items-center gap-3">
      <span class="badge badge-brand hidden sm:inline-flex">
        <span class="h-1.5 w-1.5 rounded-full bg-brand"></span>
        Administración
      </span>
      <span class="grid h-9 w-9 place-items-center rounded-full bg-gradient-to-br from-brand to-brand-dark text-sm font-bold text-white shadow-[0_8px_18px_-10px_rgb(255_96_0/0.9)]" aria-hidden="true">F</span>
    </div>
  </div>
</header>
