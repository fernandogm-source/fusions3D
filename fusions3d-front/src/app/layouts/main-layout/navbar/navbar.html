<header class="sticky top-0 z-50 border-b border-slate-800 bg-slate-950/90 backdrop-blur">
  <nav class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- Logo -->
    <a routerLink="/impresiones" class="flex items-center gap-2.5" aria-label="Fusions3D - Inicio">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        class="h-8 w-8 text-[#ff6000]"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M21 7.5l-9-5.25L3 7.5m18 0l-9 5.25m9-5.25v9l-9 5.25M3 7.5l9 5.25M3 7.5v9l9 5.25m0-9v9"
        />
      </svg>
      <span class="text-xl font-extrabold tracking-tight text-slate-100">
        Fusions<span class="text-[#ff6000]">3D</span>
      </span>
    </a>

    <!-- Navegación escritorio -->
    <div class="hidden items-center gap-1 md:flex">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          class="rounded-lg px-4 py-2 text-sm font-medium text-slate-300 transition hover:bg-slate-800/60 hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </div>

    <!-- Botón hamburguesa (móvil) -->
    <button
      type="button"
      class="rounded-lg p-2 text-slate-300 transition hover:bg-slate-800 md:hidden"
      (click)="menuOpen.set(!menuOpen())"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Abrir menú de navegación"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
        @if (menuOpen()) {
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        } @else {
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
        }
      </svg>
    </button>
  </nav>

  <!-- Menú móvil -->
  @if (menuOpen()) {
    <div id="mobile-menu" class="border-t border-slate-800 px-4 pb-4 pt-2 md:hidden">
      @for (link of links; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="bg-slate-800 text-white"
          [routerLinkActiveOptions]="{ exact: link.exact }"
          (click)="menuOpen.set(false)"
          class="block rounded-lg px-4 py-2.5 text-sm font-medium text-slate-300 transition hover:bg-slate-800/60 hover:text-white"
        >
          {{ link.label }}
        </a>
      }
    </div>
  }
</header>
