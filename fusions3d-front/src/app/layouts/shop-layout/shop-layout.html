<div class="flex min-h-screen flex-col bg-base">
  <header class="sticky top-0 z-30 border-b border-line/80 bg-base/80 backdrop-blur-xl">
    <div class="mx-auto flex h-16 w-full max-w-7xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <a routerLink="/" class="shrink-0 font-display text-xl font-bold tracking-tight text-ink" aria-label="Fusions3D - Inicio">
        Fusions<span class="text-brand">3D</span>
      </a>

      <div class="hidden flex-1 justify-center md:flex">
        <div class="w-full max-w-md">
          <app-search-input
            [value]="searchValue()"
            placeholder="Buscar impresiones…"
            (valueChange)="onSearch($event)"
          />
        </div>
      </div>

      <div class="flex items-center gap-1">
        <button
          type="button"
          class="btn btn-ghost !p-2 md:hidden"
          aria-label="Buscar"
          [attr.aria-expanded]="mobileSearchOpen()"
          (click)="mobileSearchOpen.set(!mobileSearchOpen())"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 18a7 7 0 100-14 7 7 0 000 14z" />
          </svg>
        </button>

        <nav class="flex items-center gap-1" aria-label="Principal">
          <a routerLink="/" routerLinkActive="nav-link-active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link px-2 text-xs sm:px-3 sm:text-sm">Inicio</a>
          <a routerLink="/shop" routerLinkActive="nav-link-active" class="nav-link px-2 text-xs sm:px-3 sm:text-sm">Catálogo</a>
        </nav>
      </div>
    </div>

    @if (mobileSearchOpen()) {
      <div class="border-t border-line/70 px-4 py-3 md:hidden">
        <app-search-input
          [value]="searchValue()"
          placeholder="Buscar impresiones…"
          (valueChange)="onSearch($event)"
        />
      </div>
    }
  </header>

  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-10 sm:px-6 lg:px-8">
    <router-outlet />
  </main>

  <footer class="border-t border-line/70 py-6 text-center text-xs text-ink-faint">
    Fusions3D © {{ year }} — Objetos impresos en 3D
  </footer>
</div>
